<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Food Order Website</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    font-family: Arial;
    margin:0;
    background:#f5f5f5;
}

header{
    background:#ff4757;
    color:white;
    padding:15px;
    text-align:center;
    font-size:24px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:20px;
}

.card{
    background:white;
    width:200px;
    margin:10px;
    padding:10px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

button{
    background:#ff4757;
    color:white;
    border:none;
    padding:8px;
    margin-top:5px;
    cursor:pointer;
    border-radius:5px;
}

.cart{
    position:fixed;
    right:20px;
    top:80px;
    background:white;
    padding:15px;
    width:250px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

</style>
</head>

<body>

<header>
🍔 My Food Order App
</header>

<div class="container">

    <div class="card">
        <h3>Burger</h3>
        <p>₹120</p>
        <button onclick="addToCart('Burger',120)">Add</button>
    </div>

    <div class="card">
        <h3>Pizza</h3>
        <p>₹250</p>
        <button onclick="addToCart('Pizza',250)">Add</button>
    </div>

    <div class="card">
        <h3>Fries</h3>
        <p>₹80</p>
        <button onclick="addToCart('Fries',80)">Add</button>
    </div>

</div>

<!-- CART -->
<div class="cart">
    <h3>Your Cart</h3>
    <div id="cartItems"></div>
    <h4>Total: ₹<span id="total">0</span></h4>

    <input type="text" id="name" placeholder="Your Name"><br><br>
    <input type="text" id="phone" placeholder="Phone"><br><br>

    <button onclick="placeOrder()">Order on WhatsApp</button>
</div>

<script>

let cart = [];
let total = 0;

function addToCart(item, price){
    cart.push({item, price});
    total += price;
    updateCart();
}

function updateCart(){
    let html = "";
    cart.forEach(c => {
        html += c.item + " - ₹" + c.price + "<br>";
    });

    document.getElementById("cartItems").innerHTML = html;
    document.getElementById("total").innerText = total;
}

function placeOrder(){
    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;

    if(cart.length === 0){
        alert("Cart is empty!");
        return;
    }

    let msg = "Hello, I want to order:%0A";
    cart.forEach(c=>{
        msg += c.item + " - ₹" + c.price + "%0A";
    });

    msg += "%0ATotal: ₹" + total;
    msg += "%0AName: " + name;
    msg += "%0APhone: " + phone;

    let whatsappNumber = "917909765965"; // change your number

    let url = "https://wa.me/" + whatsappNumber + "?text=" + msg;

    window.open(url, "_blank");
}

</script>

</body>
</html>
